name: BLOOM validation
on:
  pull_request:
  push:
    branches: [main, feature/bloom-launch-readiness, fix/safety-center-and-runtime-checks]
  workflow_dispatch:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check bloom-config.js
          node --check bloom-enhancements.js
          node --check bloom-backend.js
          node --check bloom-launch-upgrades.js
          node --check bloom-social-unification.js
          node --check bloom-prototype-app.js
          node --check bloom-platforms.js
          node --check scripts/check-bloom.mjs
          node scripts/check-bloom.mjs
      - name: Check expected feature wiring
        run: |
          grep -q 'bloom-config.js' index.html
          grep -q 'bloom-prototype-live.css' index.html
          grep -q 'bloom-prototype-app.js' index.html
          grep -q 'id="tab-feed"' index.html
          grep -q 'id="tab-chat"' index.html
          grep -q 'id="tab-profile"' index.html
          grep -q 'href="stanner-circles.html"' index.html
          grep -q 'href="album-display.html"' index.html
          grep -q 'href="curated-finds.html?compose=1"' index.html
          grep -q 'href="your-mix.html"' index.html
          grep -q 'href="feedback-booth.html"' index.html
          grep -q 'feedback_submissions' supabase/feedback-booth.sql
          grep -q 'id="bpCreateFind"' curated-finds.html
          grep -q 'id="bpMixPreview"' your-mix.html
          grep -q 'feed-engagement.sql' README.md
          grep -q 'bloom_post_engagement' supabase/feed-engagement.sql
          grep -q 'open.spotify.com/embed' bloom-enhancements.js
          grep -q 'enable row level security' supabase/schema.sql
          if grep -Eiq 'service_role[[:space:]]*:' bloom-config.js; then
            echo 'Do not place service-role keys in browser configuration.'
            exit 1
          fi

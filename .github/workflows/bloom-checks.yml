name: BLOOM universal validation
on:
  pull_request:
  push:
    branches: [main, feature/universal-bloom-social]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check bloom-config.js
          node --check bloom-app.js
          node --check scripts/check-bloom.mjs
      - name: Run regression and security invariants
        run: node scripts/check-bloom.mjs
      - name: Check expected app wiring
        run: |
          grep -q 'bloom-app.css' index.html
          grep -q 'bloom-app.js' index.html
          grep -q 'id="createNavButton"' index.html
          grep -q 'create table if not exists public.circles' supabase/universal-social-platform.sql
          grep -q 'create table if not exists public.blocked_users' supabase/universal-social-platform.sql
          grep -q 'bloom-media' supabase/universal-social-platform.sql
          grep -q 'getUserMedia' bloom-app.js
          grep -q 'message_type.*post_share' bloom-app.js
          if grep -Eiq 'service_role[[:space:]]*:' bloom-config.js; then
            echo 'Do not place service-role keys in browser configuration.'
            exit 1
          fi

name: BLOOM quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bloom-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: JavaScript syntax and BLOOM regression checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check frontend JavaScript syntax
        run: |
          node --check bloom-enhancements.js
          node --check bloom-backend.js
          node --check bloom-launch-upgrades.js
          node --check bloom-social-unification.js

      - name: Run BLOOM regression and security invariants
        run: node scripts/check-bloom.mjs

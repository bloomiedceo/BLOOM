name: BLOOM universal app checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bloom-universal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Universal app syntax and security regressions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check bloom-config.js
          node --check bloom-app.js
          node --check scripts/check-bloom.mjs
      - name: Run BLOOM regression and security checks
        run: node scripts/check-bloom.mjs
